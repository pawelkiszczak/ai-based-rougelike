name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable

jobs:
  foundation:
    name: Godot foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          mv "$install_dir/Godot_v${GODOT_VERSION}_linux.x86_64" "$install_dir/godot"
          chmod +x "$install_dir/godot"
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          godot --version

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ hashFiles('game/project.godot', 'game/**/*.tscn') }}

      - name: Import project headlessly
        run: godot --headless --path game --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Validate repository foundation
        run: python3 tools/validate_foundation.py 2>&1 | tee "$RUNNER_TEMP/foundation-validation.log"
      - name: Run GameState tests
        run: godot --headless --path game -s res://tests/test_game_state.gd 2>&1 | tee "$RUNNER_TEMP/game-state-test.log"
      - name: Run RNGService tests
        run: godot --headless --path game -s res://tests/test_rng_service.gd 2>&1 | tee "$RUNNER_TEMP/rng-service-test.log"
      - name: Run MutationData tests
        run: godot --headless --path game -s res://tests/test_mutation_data.gd 2>&1 | tee "$RUNNER_TEMP/mutation-data-test.log"
      - name: Run RunController tests
        run: godot --headless --path game -s res://tests/test_run_controller.gd 2>&1 | tee "$RUNNER_TEMP/run-controller-test.log"
      - name: Run SaveSystem tests
        run: godot --headless --path game -s res://tests/test_save_system.gd 2>&1 | tee "$RUNNER_TEMP/save-system-test.log"
      - name: Run RunScreen tests
        run: godot --headless --path game -s res://tests/test_run_screen.gd 2>&1 | tee "$RUNNER_TEMP/run-screen-test.log"
      - name: Run deterministic harness
        run: |
          godot --headless --path game -s ../tools/harness.gd -- --seed-base 1000 --count 100 --output "$RUNNER_TEMP/harness-a.json" 2>&1 | tee "$RUNNER_TEMP/harness-a.log"
          godot --headless --path game -s ../tools/harness.gd -- --seed-base 1000 --count 100 --output "$RUNNER_TEMP/harness-b.json" 2>&1 | tee "$RUNNER_TEMP/harness-b.log"
          cmp "$RUNNER_TEMP/harness-a.json" "$RUNNER_TEMP/harness-b.json"
          if godot --headless --path game -s ../tools/harness.gd -- --count 1 --mutation-dir res://tests/fixtures --output "$RUNNER_TEMP/harness-malformed.json" > "$RUNNER_TEMP/harness-malformed.log" 2>&1; then
            echo "Malformed mutation fixture unexpectedly succeeded" >&2
            exit 1
          fi
          python3 -c 'from pathlib import Path; import sys; assert "malformed_fixture" in Path(sys.argv[1]).read_text()' "$RUNNER_TEMP/harness-malformed.log"

      - name: Upload validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/foundation-validation.log
            ${{ runner.temp }}/game-state-test.log
            ${{ runner.temp }}/rng-service-test.log
            ${{ runner.temp }}/mutation-data-test.log
            ${{ runner.temp }}/run-controller-test.log
            ${{ runner.temp }}/save-system-test.log
            ${{ runner.temp }}/run-screen-test.log
            ${{ runner.temp }}/harness-a.log
            ${{ runner.temp }}/harness-b.log
            ${{ runner.temp }}/harness-malformed.log
          if-no-files-found: ignore
