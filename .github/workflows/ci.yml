name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable

jobs:
  foundation:
    name: Godot foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          mv "$install_dir/Godot_v${GODOT_VERSION}_linux.x86_64" "$install_dir/godot"
          chmod +x "$install_dir/godot"
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          godot --version

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ hashFiles('game/project.godot', 'game/**/*.tscn') }}

      - name: Import project headlessly
        run: godot --headless --path game --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Validate repository foundation
        run: python3 tools/validate_foundation.py 2>&1 | tee "$RUNNER_TEMP/foundation-validation.log"
      - name: Validate slice art
        run: python3 tools/validate_art.py 2>&1 | tee "$RUNNER_TEMP/art-validation.log"
      - name: Validate audio assets
        run: python3 tools/validate_audio.py 2>&1 | tee "$RUNNER_TEMP/audio-validation.log"
      - name: Validate license provenance
        run: python3 tools/validate_licenses.py 2>&1 | tee "$RUNNER_TEMP/license-validation.log"
      - name: Validate narrative content
        run: python3 tools/validate_narrative.py 2>&1 | tee "$RUNNER_TEMP/narrative-validation.log"
      - name: Run GameState tests
        run: godot --headless --path game -s res://tests/test_game_state.gd 2>&1 | tee "$RUNNER_TEMP/game-state-test.log"
      - name: Run RNGService tests
        run: godot --headless --path game -s res://tests/test_rng_service.gd 2>&1 | tee "$RUNNER_TEMP/rng-service-test.log"
      - name: Run MutationData tests
        run: godot --headless --path game -s res://tests/test_mutation_data.gd 2>&1 | tee "$RUNNER_TEMP/mutation-data-test.log"
      - name: Run Mutation batch tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_mutation_batch_31_45.gd 2>&1 | tee "$RUNNER_TEMP/mutation-batch-test.log"
      - name: Run Mutation batch 46-60 tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_mutation_batch_46_60.gd 2>&1 | tee "$RUNNER_TEMP/mutation-batch-46-60-test.log"
      - name: Run Mutation batch 61-75 tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_mutation_batch_61_75.gd 2>&1 | tee "$RUNNER_TEMP/mutation-batch-61-75-test.log"
      - name: Run lineage unlock tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_lineage_unlocks.gd 2>&1 | tee "$RUNNER_TEMP/lineage-unlocks-test.log"
      - name: Run architecture selection tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_architecture_selection.gd 2>&1 | tee "$RUNNER_TEMP/architecture-selection-test.log"
      - name: Run license manifest tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_license_manifest.gd 2>&1 | tee "$RUNNER_TEMP/license-manifest-test.log"
      - name: Run build metadata tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_build_metadata.gd 2>&1 | tee "$RUNNER_TEMP/build-metadata-test.log"
      - name: Run daily run tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_daily_runs.gd 2>&1 | tee "$RUNNER_TEMP/daily-runs-test.log"
      - name: Run NarrativeSystem tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_narrative_system.gd 2>&1 | tee "$RUNNER_TEMP/narrative-system-test.log"
      - name: Run RunController tests
        run: godot --headless --path game -s res://tests/test_run_controller.gd 2>&1 | tee "$RUNNER_TEMP/run-controller-test.log"
      - name: Run EncounterFSM tests
        run: godot --headless --path game -s res://tests/test_encounter_fsm.gd 2>&1 | tee "$RUNNER_TEMP/encounter-fsm-test.log"
      - name: Run encounter variety tests
        run: godot --headless --path game -s res://tests/test_encounter_variety.gd 2>&1 | tee "$RUNNER_TEMP/encounter-variety-test.log"
      - name: Run SaveSystem tests
        run: godot --headless --path game -s res://tests/test_save_system.gd 2>&1 | tee "$RUNNER_TEMP/save-system-test.log"
      - name: Run RunScreen tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_run_screen.gd 2>&1 | tee "$RUNNER_TEMP/run-screen-test.log"
      - name: Run ArchiveScreen tests
        run: godot --headless --path game -s res://tests/test_archive_screen.gd 2>&1 | tee "$RUNNER_TEMP/archive-screen-test.log"
      - name: Run RunRecap tests
        run: godot --headless --path game -s res://tests/test_run_recap.gd 2>&1 | tee "$RUNNER_TEMP/run-recap-test.log"
      - name: Run TelemetryStore tests
        run: godot --headless --path game -s res://tests/test_telemetry_store.gd 2>&1 | tee "$RUNNER_TEMP/telemetry-store-test.log"
      - name: Run EnvironmentData tests
        run: godot --headless --path game -s res://tests/test_environment_data.gd 2>&1 | tee "$RUNNER_TEMP/environment-data-test.log"
      - name: Run Environment two tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_environment_two.gd 2>&1 | tee "$RUNNER_TEMP/environment-two-test.log"
      - name: Run Environment three tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_environment_three.gd 2>&1 | tee "$RUNNER_TEMP/environment-three-test.log"
      - name: Run FactionData tests
        run: godot --headless --path game -s res://tests/test_faction_data.gd 2>&1 | tee "$RUNNER_TEMP/faction-data-test.log"
      - name: Run Faction two tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_faction_two.gd 2>&1 | tee "$RUNNER_TEMP/faction-two-test.log"
      - name: Run Faction three tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_faction_three.gd 2>&1 | tee "$RUNNER_TEMP/faction-three-test.log"
      - name: Run Faction four tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_faction_four.gd 2>&1 | tee "$RUNNER_TEMP/faction-four-test.log"
      - name: Run FactionReputation tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_faction_reputation.gd 2>&1 | tee "$RUNNER_TEMP/faction-reputation-test.log"
      - name: Run AdaptiveEnemyDirector tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_adaptive_enemy_director.gd 2>&1 | tee "$RUNNER_TEMP/adaptive-director-test.log"
      - name: Run event template tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_event_templates.gd 2>&1 | tee "$RUNNER_TEMP/event-templates-test.log"
      - name: Run Event batch 1-12 tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_event_batch_1_12.gd 2>&1 | tee "$RUNNER_TEMP/event-batch-1-12-test.log"
      - name: Run Event batch 13-24 tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_event_batch_13_24.gd 2>&1 | tee "$RUNNER_TEMP/event-batch-13-24-test.log"
      - name: Run Event batch 25-36 tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_event_batch_25_36.gd 2>&1 | tee "$RUNNER_TEMP/event-batch-25-36-test.log"
      - name: Run Event batch 37-48 tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_event_batch_37_48.gd 2>&1 | tee "$RUNNER_TEMP/event-batch-37-48-test.log"
      - name: Run StatsStore tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_stats_store.gd 2>&1 | tee "$RUNNER_TEMP/stats-store-test.log"
      - name: Run AccessibilitySettings tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_accessibility_settings.gd 2>&1 | tee "$RUNNER_TEMP/accessibility-settings-test.log"
      - name: Run BossGate tests
        run: godot --headless --path game -s res://tests/test_boss_gate.gd 2>&1 | tee "$RUNNER_TEMP/boss-gate-test.log"
      - name: Run AudioDirector tests
        run: godot --headless --path game -s res://tests/test_audio_director.gd 2>&1 | tee "$RUNNER_TEMP/audio-director-test.log"
      - name: Run Boss three tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_boss_three.gd 2>&1 | tee "$RUNNER_TEMP/boss-three-test.log"
      - name: Run Boss two tests
        run: set -o pipefail; godot --headless --path game -s res://tests/test_boss_two.gd 2>&1 | tee "$RUNNER_TEMP/boss-two-test.log"
      - name: Run ControllerNavigation tests
        run: godot --headless --path game -s res://tests/test_controller_navigation.gd 2>&1 | tee "$RUNNER_TEMP/controller-navigation-test.log"
      - name: Run deterministic harness
        run: |
          godot --headless --path game -s ../tools/harness.gd -- --seed-base 1000 --count 1000 --output "$RUNNER_TEMP/harness-a.json" 2>&1 | tee "$RUNNER_TEMP/harness-a.log"
          godot --headless --path game -s ../tools/harness.gd -- --seed-base 1000 --count 1000 --output "$RUNNER_TEMP/harness-b.json" 2>&1 | tee "$RUNNER_TEMP/harness-b.log"
          cmp "$RUNNER_TEMP/harness-a.json" "$RUNNER_TEMP/harness-b.json"
          if godot --headless --path game -s ../tools/harness.gd -- --count 1 --mutation-dir res://tests/fixtures --output "$RUNNER_TEMP/harness-malformed.json" > "$RUNNER_TEMP/harness-malformed.log" 2>&1; then
            echo "Malformed mutation fixture unexpectedly succeeded" >&2
            exit 1
          fi
          python3 -c 'from pathlib import Path; import sys; assert "malformed_fixture" in Path(sys.argv[1]).read_text()' "$RUNNER_TEMP/harness-malformed.log"

      - name: Upload validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/foundation-validation.log
            ${{ runner.temp }}/art-validation.log
            ${{ runner.temp }}/mutation-batch-61-75-test.log
            ${{ runner.temp }}/audio-validation.log
            ${{ runner.temp }}/license-validation.log
            ${{ runner.temp }}/narrative-validation.log
            ${{ runner.temp }}/mutation-batch-46-60-test.log
            ${{ runner.temp }}/game-state-test.log
            ${{ runner.temp }}/mutation-batch-test.log
            ${{ runner.temp }}/rng-service-test.log
            ${{ runner.temp }}/mutation-data-test.log
            ${{ runner.temp }}/lineage-unlocks-test.log
            ${{ runner.temp }}/license-manifest-test.log
            ${{ runner.temp }}/daily-runs-test.log
            ${{ runner.temp }}/narrative-system-test.log
            ${{ runner.temp }}/architecture-selection-test.log
            ${{ runner.temp }}/run-controller-test.log
            ${{ runner.temp }}/encounter-fsm-test.log
            ${{ runner.temp }}/encounter-variety-test.log
            ${{ runner.temp }}/save-system-test.log
            ${{ runner.temp }}/run-screen-test.log
            ${{ runner.temp }}/archive-screen-test.log
            ${{ runner.temp }}/event-batch-37-48-test.log
            ${{ runner.temp }}/run-recap-test.log
            ${{ runner.temp }}/event-batch-25-36-test.log
            ${{ runner.temp }}/telemetry-store-test.log
            ${{ runner.temp }}/event-batch-13-24-test.log
            ${{ runner.temp }}/faction-reputation-test.log
            ${{ runner.temp }}/event-batch-1-12-test.log
            ${{ runner.temp }}/adaptive-director-test.log
            ${{ runner.temp }}/event-templates-test.log
            ${{ runner.temp }}/faction-four-test.log
            ${{ runner.temp }}/stats-store-test.log
            ${{ runner.temp }}/faction-three-test.log
            ${{ runner.temp }}/accessibility-settings-test.log
            ${{ runner.temp }}/faction-two-test.log
            ${{ runner.temp }}/environment-data-test.log
            ${{ runner.temp }}/faction-data-test.log
            ${{ runner.temp }}/boss-gate-test.log
            ${{ runner.temp }}/boss-two-test.log
            ${{ runner.temp }}/boss-three-test.log
            ${{ runner.temp }}/audio-director-test.log
            ${{ runner.temp }}/environment-three-test.log
            ${{ runner.temp }}/controller-navigation-test.log
            ${{ runner.temp }}/environment-two-test.log
            ${{ runner.temp }}/harness-a.log
            ${{ runner.temp }}/harness-b.log
            ${{ runner.temp }}/harness-malformed.log
          if-no-files-found: ignore
  exports:
    name: Release exports
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot editor and templates
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          mv "$install_dir/Godot_v${GODOT_VERSION}_linux.x86_64" "$install_dir/godot"
          chmod +x "$install_dir/godot"
          echo "$install_dir" >> "$GITHUB_PATH"
          templates_archive="$RUNNER_TEMP/godot-templates.tpz"
          templates_dir="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$templates_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            --output "$templates_archive"
          unzip -q "$templates_archive" -d "$RUNNER_TEMP/godot-templates"
          cp -R "$RUNNER_TEMP/godot-templates/templates/." "$templates_dir/"
          export PATH="$install_dir:$PATH"
          godot --version

      - name: Generate build metadata
        shell: bash
        env:
          VERSION: 0.1.0
          CHANNEL: ci
        run: |
          set -euo pipefail
          commit_timestamp="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 - "$GITHUB_SHA" "$commit_timestamp" "$VERSION" "$CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path
          commit, timestamp, version, channel = sys.argv[1:]
          Path("game/build_metadata.json").write_text(json.dumps({
              "version": version,
              "source_commit": commit,
              "build_timestamp": timestamp,
              "channel": channel,
          }, indent=2) + "\n", encoding="utf-8")
          PY
          python3 tools/validate_build_metadata.py

      - name: Export Linux and Windows packages
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/exports"
          mkdir -p "$output/linux" "$output/windows"
          godot --headless --path game --export-release Linux "$output/linux/emergence-protocol"
          godot --headless --path game --export-release Windows "$output/windows/emergence-protocol.exe"
          cp game/build_metadata.json "$output/linux/build_metadata.json"
          cp game/build_metadata.json "$output/windows/build_metadata.json"
          python3 tools/validate_build_metadata.py game/build_metadata.json
          python3 tools/validate_build_metadata.py "$output/linux/build_metadata.json"
          python3 tools/validate_build_metadata.py "$output/windows/build_metadata.json"
          test -x "$output/linux/emergence-protocol"
          test -f "$output/windows/emergence-protocol.exe"
          timeout 15 "$output/linux/emergence-protocol" --headless --quit-after 1
          (cd "$output/linux" && zip -q -r ../emergence-protocol-linux-x86_64.zip .)
          (cd "$output/windows" && zip -q -r ../emergence-protocol-windows-x86_64.zip .)
          (cd "$output" && sha256sum emergence-protocol-linux-x86_64.zip > emergence-protocol-linux-x86_64.zip.sha256 && sha256sum emergence-protocol-windows-x86_64.zip > emergence-protocol-windows-x86_64.zip.sha256)

      - name: Upload release exports
        uses: actions/upload-artifact@v4
        with:
          name: release-exports
          path: |
            ${{ runner.temp }}/exports/*.zip
            ${{ runner.temp }}/exports/*.sha256
